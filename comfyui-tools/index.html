<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ComfyUI Tools</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a237e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ComfyTools">
<link rel="apple-touch-icon" href="icons/icon.svg">
<style>
  :root {
    --bg: #f6f6f4; --surface: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --border: #dcdcd6; --accent: #3b5bdb; --accent-text: #ffffff;
    --error: #c92a2a; --warn: #b26a00; --ok: #2b8a3e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --surface: #20201e; --text: #ececea; --muted: #9a9a94;
      --border: #3a3a36; --accent: #748ffc; --accent-text: #10131f;
      --error: #ff8787; --warn: #ffc078; --ok: #8ce99a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; }
  .app-version { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 6px; }
  .header-actions { display: flex; gap: 8px; }
  #installBtn { display: none; }
  button {
    font: inherit; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    padding: 8px 14px; border-radius: 8px; cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  textarea, input {
    width: 100%; font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px;
  }
  textarea { min-height: 110px; resize: vertical; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .hint { color: var(--muted); font-size: 13px; }
  .status { margin-top: 16px; min-height: 22px; }
  .status.error { color: var(--error); white-space: pre-wrap; }
  .status.warn { color: var(--warn); }
  .status.ok { color: var(--ok); }

  .marquee { display: none; margin-top: 16px; }
  .marquee.active { display: block; }
  .bar { position: relative; height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .bar::before {
    content: ""; position: absolute; top: 0; bottom: 0; width: 35%; border-radius: 3px;
    background: var(--accent); animation: slide 1.3s ease-in-out infinite;
  }
  @keyframes slide { from { left: -35%; } to { left: 100%; } }
  .marquee .label { margin-top: 6px; color: var(--muted); font-size: 13px; }

  .results { margin-top: 24px; display: grid; gap: 20px; }
  figure { margin: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  figure img { display: block; width: 100%; height: auto; }
  figcaption { padding: 10px 12px; font-size: 13px; color: var(--muted); display: flex; gap: 10px; justify-content: space-between; align-items: start; }
  figcaption span { overflow-wrap: anywhere; }
  figcaption a { color: var(--accent); white-space: nowrap; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .tab {
    border: 1px solid transparent; border-bottom: none; border-radius: 8px 8px 0 0;
    background: transparent; color: var(--muted); margin-bottom: -1px; padding: 8px 16px;
  }
  .tab[aria-selected="true"] { background: var(--surface); border-color: var(--border); color: var(--text); font-weight: 600; }
  .panel[hidden] { display: none; }
  .server-row { margin: -8px 0 12px; }

  .upload { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .upload input[type=file] { display: none; }
  .upload .filename { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .preview { display: none; max-width: 100%; max-height: 260px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 10px; }
  .preview.active { display: block; }

  dialog {
    border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text);
    width: min(480px, calc(100vw - 32px)); padding: 20px;
  }
  dialog::backdrop { background: rgb(0 0 0 / .45); }
  dialog h2 { margin: 0 0 12px; font-size: 17px; }
  dialog label { display: block; margin-top: 12px; font-size: 13px; color: var(--muted); }
  dialog label input { margin-top: 4px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>ComfyUI Tools <span class="app-version" id="appVersion"></span></h1>
    <div class="header-actions">
      <button id="configBtn" type="button">Configuration</button>
      <button id="installBtn" type="button">&#8595; Install App</button>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" type="button" id="tab-generate" aria-controls="panel-generate" aria-selected="true">Generate image</button>
    <button class="tab" role="tab" type="button" id="tab-edit" aria-controls="panel-edit" aria-selected="false">Edit image</button>
  </div>
  <div class="server-row hint" id="serverHint"></div>

  <!-- Generate image -->
  <section class="panel" id="panel-generate" role="tabpanel" aria-labelledby="tab-generate">
    <textarea id="genPrompt" placeholder="Describe the image… (Ctrl+Enter to generate)"></textarea>
    <div class="row">
      <button id="genBtn" class="primary" type="button">Generate</button>
    </div>
    <div class="marquee" id="genMarquee">
      <div class="bar"></div>
      <div class="label" id="genMarqueeLabel">Waiting…</div>
    </div>
    <div class="status" id="genStatus"></div>
    <div class="results" id="genResults"></div>
  </section>

  <!-- Edit image -->
  <section class="panel" id="panel-edit" role="tabpanel" aria-labelledby="tab-edit" hidden>
    <div class="upload">
      <input id="editFile" type="file" accept="image/*">
      <button id="editUploadBtn" type="button">Choose image…</button>
      <span class="filename" id="editFileName">No image selected</span>
    </div>
    <img class="preview" id="editPreview" alt="Selected input image">
    <textarea id="editPrompt" placeholder="Describe the edit… (Ctrl+Enter to generate)"></textarea>
    <div class="row">
      <button id="editBtn" class="primary" type="button">Generate</button>
    </div>
    <div class="marquee" id="editMarquee">
      <div class="bar"></div>
      <div class="label" id="editMarqueeLabel">Waiting…</div>
    </div>
    <div class="status" id="editStatus"></div>
    <div class="results" id="editResults"></div>
  </section>
</main>

<dialog id="configDialog">
  <form method="dialog" id="configForm">
    <h2>Configuration</h2>
    <label>Base URL
      <input id="cfgUrl" type="url" required>
    </label>
    <label>Token (optional)
      <input id="cfgToken" type="password" autocomplete="off" spellcheck="false">
    </label>
    <div class="row" style="justify-content: flex-end; margin-top: 18px;">
      <button value="cancel" formnovalidate>Cancel</button>
      <button value="save" class="primary">Save</button>
    </div>
  </form>
</dialog>

<script>
const CONFIG_KEY = "comfyui-generator-config";
const TAB_KEY = "comfyui-tools-tab";
const SEED_KEYS = new Set(["seed", "noise_seed", "sampling_mode.seed"]);
const POLL_MS = 1000;
const TIMEOUT_MS = 30 * 60 * 1000;

const $ = (id) => document.getElementById(id);

// ---------- configuration (localStorage) ----------
function loadConfig() {
  try {
    const c = JSON.parse(localStorage.getItem(CONFIG_KEY) || "{}");
    return { url: c.url || "", token: c.token || "" };
  } catch {
    return { url: "", token: "" };
  }
}
function saveConfig(c) {
  try { localStorage.setItem(CONFIG_KEY, JSON.stringify(c)); }
  catch (e) { activePanel().setStatus("Could not save configuration: " + e.message, "error"); }
}
function refreshHint() {
  const c = loadConfig();
  $("serverHint").textContent = c.url ? c.url + (c.token ? " (token set)" : "") : "Not configured";
}
function openConfig() {
  const c = loadConfig();
  $("cfgUrl").value = c.url; $("cfgToken").value = c.token;
  $("configDialog").showModal();
}
$("configBtn").addEventListener("click", openConfig);
$("configDialog").addEventListener("close", () => {
  if ($("configDialog").returnValue !== "save") return;
  saveConfig({
    url: $("cfgUrl").value.trim().replace(/\/+$/, ""),
    token: $("cfgToken").value.trim(),
  });
  refreshHint();
});

// ---------- API helpers ----------
async function api(path, { method = "GET", json, form, raw = false } = {}) {
  const c = loadConfig();
  const headers = {};
  if (json !== undefined) headers["Content-Type"] = "application/json";
  let url = c.url + path;
  if (c.token) url += (path.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(c.token);
  let res;
  try {
    res = await fetch(url, {
      method, headers,
      // FormData sets its own multipart Content-Type with boundary
      body: form !== undefined ? form : json !== undefined ? JSON.stringify(json) : undefined,
    });
  } catch (e) {
    throw new Error(`Network/CORS error calling ${path}: ${e.message}`);
  }
  if (!res.ok) {
    const body = await res.text().catch(() => "");
    throw new Error(`HTTP ${res.status} from ${path}${body ? ": " + body.slice(0, 500) : ""}`);
  }
  if (raw) return res;
  const text = await res.text();
  return text.trim() ? JSON.parse(text) : {};
}

const _workflowCache = new Map();

// Load a workflow template once per URL; retry on the next call if loading failed.
function loadWorkflow(workflowUrl) {
  if (!_workflowCache.has(workflowUrl)) {
    const p = fetch(workflowUrl)
      .then((res) => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      })
      .catch((e) => {
        _workflowCache.delete(workflowUrl);
        const hint = location.protocol === "file:"
          ? "\nThe page is opened as a local file, and browsers block loading files from file:// pages. Serve this folder over HTTP instead (e.g. `python -m http.server`) and open it via http://localhost."
          : "";
        throw new Error(`Could not load workflow from ${workflowUrl}: ${e.message}${hint}`);
      });
    _workflowCache.set(workflowUrl, p);
  }
  return _workflowCache.get(workflowUrl);
}

// Deep-copy the workflow, replacing every {{key}} placeholder in strings and randomizing seeds.
async function buildWorkflow(workflowUrl, replacements) {
  const template = await loadWorkflow(workflowUrl);
  const seed = Math.floor(Math.random() * 999_999_999_999_999);
  const replaceAll = (s) => {
    for (const [k, val] of Object.entries(replacements)) s = s.split(`{{${k}}}`).join(val);
    return s;
  };
  const walk = (v, key) => {
    if (typeof v === "string") return replaceAll(v);
    if (typeof v === "number" && SEED_KEYS.has(key)) return seed;
    if (Array.isArray(v)) return v.map((x) => walk(x));
    if (v && typeof v === "object") {
      const out = {};
      for (const [k, x] of Object.entries(v)) out[k] = walk(x, k);
      return out;
    }
    return v;
  };
  return { workflow: walk(template), seed };
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function waitForResult(promptId, onTick) {
  const start = Date.now();
  while (Date.now() - start < TIMEOUT_MS) {
    const history = await api(`/history/${promptId}`);
    const entry = history[promptId];
    if (entry) {
      const st = entry.status || {};
      if (st.status_str === "error") {
        const msgs = (st.messages || []).filter((m) => m[0] === "execution_error").map((m) => m[1]);
        const detail = msgs.map((m) => `${m.node_type || ""}: ${m.exception_message || ""}`).join("\n");
        throw new Error("Execution failed" + (detail ? ":\n" + detail : ""));
      }
      if (st.completed !== false) return entry;
    }
    onTick(Math.round((Date.now() - start) / 1000));
    await sleep(POLL_MS);
  }
  throw new Error("Timed out waiting for the result");
}

function collectImages(entry) {
  const images = [];
  for (const out of Object.values(entry.outputs || {})) images.push(...(out.images || []));
  const saved = images.filter((i) => i.type === "output");
  return saved.length ? saved : images;
}

// Upload an input image to ComfyUI; returns the name to use in a LoadImage node.
async function uploadImage(file) {
  const form = new FormData();
  form.append("image", file, file.name);
  form.append("type", "input");
  const r = await api("/upload/image", { method: "POST", form });
  if (!r.name) throw new Error("Upload succeeded but no file name was returned.");
  return r.subfolder ? `${r.subfolder}/${r.name}` : r.name;
}

async function downloadImage(img) {
  const q = new URLSearchParams({ filename: img.filename, subfolder: img.subfolder || "", type: img.type || "output" });
  const res = await api(`/view?${q}`, { raw: true });
  return await res.blob();
}

// Remove from ComfyUI assets (needs --enable-assets) and drop the job from history.
async function cleanup(images, promptId) {
  const problems = [];
  for (const img of images) {
    if (!img.id) { problems.push(`${img.filename}: no asset id (is ComfyUI started with --enable-assets?)`); continue; }
    try { await api(`/api/assets/${img.id}`, { method: "DELETE" }); }
    catch (e) { problems.push(`${img.filename}: ${e.message}`); }
  }
  try { await api("/history", { method: "POST", json: { delete: [promptId] } }); }
  catch (e) { problems.push(`history: ${e.message}`); }
  return problems;
}

// ---------- UI ----------
// One panel per tab; `prefix` selects its element ids (genBtn, genPrompt, …).
function makePanel(prefix) {
  const el = (name) => $(prefix + name);
  return {
    prompt: el("Prompt"),
    button: el("Btn"),
    setStatus(text, kind = "") { const s = el("Status"); s.textContent = text; s.className = "status " + kind; },
    setBusy(busy, label = "") {
      el("Btn").disabled = busy;
      el("Marquee").classList.toggle("active", busy);
      el("MarqueeLabel").textContent = label;
    },
    addResult(blob, caption, filename) {
      const url = URL.createObjectURL(blob);
      const fig = document.createElement("figure");
      const img = document.createElement("img");
      img.src = url; img.alt = caption;
      const cap = document.createElement("figcaption");
      const text = document.createElement("span");
      text.textContent = caption;
      const a = document.createElement("a");
      a.href = url; a.download = filename; a.textContent = "Download";
      cap.append(text, a);
      fig.append(img, cap);
      el("Results").prepend(fig);
    },
  };
}

const panels = { generate: makePanel("gen"), edit: makePanel("edit") };
let activeTab = "generate";
const activePanel = () => panels[activeTab];

function selectTab(name) {
  if (!panels[name]) name = "generate";
  activeTab = name;
  for (const t of Object.keys(panels)) {
    $("tab-" + t).setAttribute("aria-selected", String(t === name));
    $("panel-" + t).hidden = t !== name;
  }
  try { localStorage.setItem(TAB_KEY, name); } catch {}
}
for (const t of Object.keys(panels)) $("tab-" + t).addEventListener("click", () => selectTab(t));

// Shared pipeline: optional pre-step (e.g. upload), queue, wait, download, clean up.
async function runWorkflow(panel, { workflowUrl, promptText, prepare }) {
  if (!promptText) { panel.setStatus("Enter a prompt first.", "warn"); return; }
  const c = loadConfig();
  if (!c.url) { panel.setStatus("Set the base URL in Configuration first.", "warn"); openConfig(); return; }

  panel.setStatus("");
  panel.setBusy(true, "Preparing…");
  try {
    const extra = prepare ? await prepare((label) => panel.setBusy(true, label)) : {};
    panel.setBusy(true, "Queuing prompt…");
    const { workflow, seed } = await buildWorkflow(workflowUrl, { prompt: promptText, ...extra });
    const queued = await api("/prompt", { method: "POST", json: { prompt: workflow, client_id: crypto.randomUUID() } });
    if (queued.node_errors && Object.keys(queued.node_errors).length) {
      throw new Error("Node errors:\n" + JSON.stringify(queued.node_errors, null, 2));
    }
    const promptId = queued.prompt_id;

    const entry = await waitForResult(promptId, (s) => panel.setBusy(true, `Generating… ${s}s`));
    const images = collectImages(entry);
    if (!images.length) throw new Error("Finished, but no image was returned.");

    panel.setBusy(true, "Downloading image…");
    const stamp = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
    for (const [i, img] of images.entries()) {
      const blob = await downloadImage(img);
      const ext = (img.filename.match(/\.[^.]+$/) || [".png"])[0];
      panel.addResult(blob, `${promptText} — seed ${seed}`, `comfyui-${stamp}${i ? "_" + (i + 1) : ""}${ext}`);
    }

    panel.setBusy(true, "Removing from ComfyUI…");
    const problems = await cleanup(images, promptId);
    if (problems.length) panel.setStatus("Image saved, but cleanup had problems:\n" + problems.join("\n"), "warn");
  } catch (e) {
    panel.setStatus(e.message, "error");
  } finally {
    panel.setBusy(false);
  }
}

// ---------- Generate image tab ----------
function generateImage() {
  return runWorkflow(panels.generate, {
    workflowUrl: "workflows/generate-image.json",
    promptText: panels.generate.prompt.value.trim(),
  });
}

// ---------- Edit image tab ----------
let editFile = null;
let editPreviewUrl = null;
$("editUploadBtn").addEventListener("click", () => $("editFile").click());
$("editFile").addEventListener("change", () => {
  editFile = $("editFile").files[0] || null;
  if (editPreviewUrl) URL.revokeObjectURL(editPreviewUrl);
  editPreviewUrl = editFile ? URL.createObjectURL(editFile) : null;
  $("editFileName").textContent = editFile ? editFile.name : "No image selected";
  $("editPreview").src = editPreviewUrl || "";
  $("editPreview").classList.toggle("active", !!editFile);
});

function editImage() {
  const panel = panels.edit;
  if (!editFile) { panel.setStatus("Choose an image first.", "warn"); return; }
  const file = editFile;
  return runWorkflow(panel, {
    workflowUrl: "workflows/image-edit.json",
    promptText: panel.prompt.value.trim(),
    prepare: async (label) => {
      label("Uploading image…");
      return { image: await uploadImage(file) };
    },
  });
}

// ---------- wiring ----------
const actions = { generate: generateImage, edit: editImage };
for (const [name, panel] of Object.entries(panels)) {
  panel.button.addEventListener("click", actions[name]);
  panel.prompt.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); actions[name](); }
  });
}

try { selectTab(localStorage.getItem(TAB_KEY) || "generate"); } catch { selectTab("generate"); }
refreshHint();
if (!loadConfig().url) openConfig();
</script>

<script>
// ── PWA install prompt ──────────────────────────────────────────────────────
let _deferredInstallPrompt = null;
const installBtn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  _deferredInstallPrompt = e;
  installBtn.style.display = "inline-block";
});

installBtn.addEventListener("click", async () => {
  if (!_deferredInstallPrompt) return;
  _deferredInstallPrompt.prompt();
  const { outcome } = await _deferredInstallPrompt.userChoice;
  if (outcome === "accepted") installBtn.style.display = "none";
  _deferredInstallPrompt = null;
});

window.addEventListener("appinstalled", () => {
  installBtn.style.display = "none";
  _deferredInstallPrompt = null;
});

// ── Service Worker registration & update detection ──────────────────────────
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then((reg) => {
        // If a SW is already controlling the page, ask it for the version
        if (navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage({ type: "GET_VERSION" });
        }

        // When a new SW installs while this page is open, activate it immediately
        reg.addEventListener("updatefound", () => {
          const newWorker = reg.installing;
          newWorker.addEventListener("statechange", () => {
            if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
              newWorker.postMessage({ type: "SKIP_WAITING" });
            }
          });
        });
      })
      .catch((err) => console.warn("[SW] Registration failed:", err));

    // When a new SW takes control, reload to load the latest version
    let refreshing = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (!refreshing) {
        refreshing = true;
        window.location.reload();
      }
    });

    // Handle messages from the SW
    navigator.serviceWorker.addEventListener("message", (event) => {
      if (event.data?.type === "VERSION") {
        document.getElementById("appVersion").textContent = "v" + event.data.version;
      }
      if (event.data?.type === "NEW_VERSION" && !refreshing) {
        refreshing = true;
        window.location.reload();
      }
    });
  });
}
</script>
</body>
</html>
